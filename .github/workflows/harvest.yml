name: Publish signed CPP browser observations

on:
  push:
    branches:
      - main
    paths:
      - "config/cpp-browser-sources.json"
      - "scripts/harvest-cpp-browser-sources.mjs"
      - "data/public-browser-reviews/**"
      - "config/cpp-browser-candidates.json"
      - "server/vzi-radar-engine/**"
      - ".github/workflows/harvest.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/vzi-radar-engine/**"
      - ".github/workflows/harvest.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpp-radar-observation-publisher
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate server shadow worker
        run: |
          php -l server/vzi-radar-engine/bin/shadow-harvest.php
          php server/vzi-radar-engine/bin/shadow-harvest.php --self-test
          php -l server/vzi-radar-engine/bin/first-aid-radar.php
          php server/vzi-radar-engine/bin/first-aid-radar.php --self-test

      - name: Validate public source registry
        run: |
          node scripts/harvest-cpp-browser-sources.mjs --self-test
          node scripts/harvest-cpp-browser-sources.mjs --validate-only

      - name: Install public PDF text reader
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[census]')
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)

      - name: Inspect all reachable public school websites
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[census]')
        run: node scripts/harvest-cpp-browser-sources.mjs --audit-candidates

      - name: Publish public website coverage evidence
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[census]')
        run: |
          mkdir -p data
          cp build/cpp-source-audit.json data/cpp-source-audit.json
          git config user.name "vzi-cpp-radar[bot]"
          git config user.email "vzi-cpp-radar[bot]@users.noreply.github.com"
          git add data/cpp-source-audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record public CPP website coverage review"
          git push origin HEAD:main

      - name: Harvest and sign approved browser sources
        if: github.event_name != 'pull_request'
        env:
          VZI_CPP_MANIFEST_SIGNING_KEY: ${{ secrets.VZI_CPP_MANIFEST_SIGNING_KEY }}
          VZI_CPP_MAX_SOURCES_PER_RUN: "100"
        run: node scripts/harvest-cpp-browser-sources.mjs

      - name: Publish latest signed manifest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p data
          cp build/cpp-browser-observations.json data/cpp-browser-observations.json
          git config user.name "vzi-cpp-radar[bot]"
          git config user.email "vzi-cpp-radar[bot]@users.noreply.github.com"
          git add data/cpp-browser-observations.json
          if git diff --cached --quiet; then
            echo "Signed observation manifest is unchanged."
            exit 0
          fi
          git commit -m "chore: publish signed CPP observations"
          git push origin HEAD:main
